name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: writer/package-lock.json }
      - run: npm ci
        working-directory: writer
      - run: npm run typecheck
        working-directory: writer
