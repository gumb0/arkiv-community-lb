name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  # The writer package: types, then the tests that need no chain. Anything
  # that needs a live network lives in writer/probes and is run by hand.
  writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: writer/package-lock.json }
      - run: npm ci
        working-directory: writer
      - run: npm run typecheck
        working-directory: writer
      - run: npm test
        working-directory: writer
