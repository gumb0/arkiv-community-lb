name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  # The Rust workspace: ci.sh is the single source — do not add checks here.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: ./tests/ci.sh

  # The compose file parses and interpolates — catches a broken stack
  # definition before a deploy does.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q

  # The writer package: types, then the tests that need no chain.
  writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: writer/package-lock.json }
      - run: npm ci
        working-directory: writer
      - run: npm run typecheck
        working-directory: writer
      - run: npm test
        working-directory: writer

  # The settle CLI: types, then the tests, which need no chain.
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: settle/package-lock.json }
      - run: npm ci
        working-directory: settle
      - run: npm run typecheck
        working-directory: settle
      - run: npm test
        working-directory: settle

  # The two probes that follow our own code, then the Rust chain path's
  # live smoke, against a local dev node. The rest of the probes measure
  # the pinned SDK and node image, so they run when a pin moves, not on
  # every push: ./scripts/run-probes.sh with no arguments.
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: writer/package-lock.json }
      - run: npm ci
        working-directory: writer
      - run: ./scripts/run-probes.sh writer-smoke service-smoke
      # The Rust chain path against the same engine: records written
      # through the sidecar, read back through the read client.
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/chain-smoke.sh
