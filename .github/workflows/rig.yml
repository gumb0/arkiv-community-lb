# The rig tier: every scenario against real dev-node containers under
# the shipped binary. On demand only — it boots a full stack per
# scenario and takes minutes, so it is a button, not a gate; the gate
# stays tests/ci.sh in ci.yml.
name: rig
on: workflow_dispatch

jobs:
  rig:
    runs-on: ubuntu-latest
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Log in to ghcr.io
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      # The scenarios with the marketplace run the writer sidecar.
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: writer/package-lock.json }
      - run: npm ci
        working-directory: writer
      - run: cargo build --workspace
      - run: cargo run -p rig -- all
