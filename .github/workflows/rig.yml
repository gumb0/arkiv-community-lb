# The rig tier: every scenario against real dev-node containers under
# the shipped binary. It boots a full stack per scenario and takes
# minutes, so it is not a gate; the gate stays tests/ci.sh in ci.yml.
# It runs on demand, and once a week: the dev-node images and the
# companion repository move without a push here.
name: rig
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC

jobs:
  rig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # The scenarios with the marketplace run the writer sidecar.
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: writer/package-lock.json }
      - run: npm ci
        working-directory: writer
      # offer-accepted runs the provider tooling from the companion
      # repo; the rig finds it through RIG_NODE_DIR.
      - uses: actions/checkout@v5
        with: { repository: gumb0/arkiv-community-node, path: node }
      - run: npm ci
        working-directory: node/marketplace
      - run: cargo build --workspace
      - run: cargo run -p rig -- all
        env: { RIG_NODE_DIR: "${{ github.workspace }}/node" }
