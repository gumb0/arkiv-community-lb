# The LB host stack: every service that runs on the LB box.
name: arkiv-community-lb

# The chain-writer sidecar's signing key: a file next to this one,
# mounted into the container, never an environment variable — `docker
# inspect` shows the environment, not a secret's content.
secrets:
  writer_key:
    file: ./writer.key

services:
  # The LB itself, built from this workspace. Copy config.example.toml
  # to config.toml and adjust; the Arkiv reference endpoint comes from
  # ARKIV_RPC_URL / ARKIV_API_KEY in .env (a real environment variable
  # beats the file). Host networking so tunneled providers are plain
  # loopback URLs.
  lb:
    build: .
    network_mode: host
    volumes:
      - ./config.toml:/etc/arkiv-lb/config.toml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ARKIV_RPC_URL: ${ARKIV_RPC_URL:-}
      ARKIV_API_KEY: ${ARKIV_API_KEY:-}
    # Started once the writer answers, and stopped before it, so the
    # LB never starts against a sidecar that is not listening yet and
    # the counts a stop writes first still have a sidecar to go
    # through. Without the condition the LB starts, cannot get the
    # sidecar's identity, exits, and is restarted until it can.
    depends_on:
      writer:
        condition: service_healthy
    restart: unless-stopped
    # A stop finishes the requests in flight, up to the request timeout
    # (30 s by default), and with the marketplace on writes the counts
    # to the chain first, which waits for the receipt. Docker's default
    # grace is 10 s.
    stop_grace_period: 200s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  # The chain-writer sidecar (docs/CHAIN_WRITER.md): the LB's entity
  # writes, signed with the key in writer.key. Host networking like the
  # LB, listening on loopback, where only the LB reaches it. Same
  # endpoint variables as the LB, so both point at one network.
  writer:
    build: ./writer
    network_mode: host
    environment:
      ARKIV_RPC_URL: ${ARKIV_RPC_URL:-}
      ARKIV_API_KEY: ${ARKIV_API_KEY:-}
      WRITER_PRIVATE_KEY_FILE: /run/secrets/writer_key
    secrets:
      - writer_key
    # Healthy once the identity route answers: the same question the LB
    # asks first, on loopback, with the node the image already has. The
    # port is the service's own rule: WRITER_PORT, or 8560.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch(`http://127.0.0.1:$${process.env.WRITER_PORT || 8560}/identity`).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # A write in flight waits for its receipt.
    stop_grace_period: 200s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  # The tunnel server NAT'd provider nodes connect to (docs/TUNNELING.md).
  # Usage: copy tunnel/frps.example.toml to tunnel/frps.toml, then
  # `docker compose up -d`.
  tunnel:
    build: ./tunnel
    # Host networking, like the LB: the forwarded provider ports bind
    # on host loopback, where the LB reaches them.
    network_mode: host
    volumes:
      - ./tunnel/frps.toml:/etc/frp/frps.toml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
