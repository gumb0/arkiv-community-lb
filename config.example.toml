# arkiv-lb configuration. Copy to config.toml and adjust; every value
# shown here is the default, so any line you do not change can be
# deleted — except the two marked "yours to set" under [marketplace].
# The file is read once at startup — restart to apply changes.
#
# The Arkiv reference endpoint is NOT configured here: the LB reads
# ARKIV_RPC_URL and ARKIV_API_KEY from the environment — the same two
# variables the chain-writer sidecar uses (see .env.example). Secrets
# never belong in this file.

[listen]
# The served JSON-RPC endpoint.
public = "0.0.0.0:8545"
# Admin API (/health, /nodes, /node/{id}) — loopback by default; it has
# no authentication, so if you widen it, it should be firewalled.
admin = "127.0.0.1:9545"

[health]
# Interval for checking provider health.
probe_interval = "5s"
# Tighter than the timeout for normal calls (attempt_timeout) on
# purpose: a probe is a cheap, lightweight request.
probe_timeout = "2s"
# Consecutive failures that quarantine / successes that readmit,
# i.e. after flip_after consecutive failures a provider is quarantined, and
# after flip_after consecutive successes it is readmitted.
# At least 2 — the LB refuses to start otherwise.
flip_after = 3
# If a provider is persistently dead, its probes get less frequent,
# up to this cadence.
max_probe_backoff = "5m"
# How often the chain height from reference RPC is sampled; 0 = every
# probe sweep. A lagging provider is noticed at most this much later.
# Every sample is one request at the reference, which is usually a
# metered endpoint — that is the reason not to go lower.
ref_height_interval = "60s"
# How often providers are checked to be on the right chain;
# 0 = every probe sweep.
chainid_check_interval = "5m"
# The chain this endpoint serves: a provider answering a different
# eth_chainId never enters rotation. Unset, chain identity goes
# unchecked.
# chain_id = 1337
# A provider this many blocks behind the reference is lagging —
# this counts as a failed health check.
lag_tolerance_blocks = 30

[proxy]
# Timeout for each attempt against one provider.
attempt_timeout = "10s"
# Total timeout for the user's request; in case of failover
# each attempt gets min(attempt_timeout, remaining).
request_timeout = "30s"
# Extra providers tried after a transport failure.
max_retries = 2
# Max user request size that is accepted.
max_request_size = "2MiB"
# Max provider response size that will be relayed to the user.
# Generous on purpose: sized to clear any legitimate arkiv_query page,
# so a breach is either an unusually heavy query or a misbehaving
# provider.
max_response_size = "64MiB"

# The marketplace runs when this section is present. Without it the LB
# runs on the static providers listed at the end alone: no discovery,
# no listing, no tunnel admission, and no Arkiv endpoint needed at
# startup. For local runs and proxy-only tests.
[marketplace]
# The chain-writer sidecar (docs/CHAIN_WRITER.md), which signs this LB's
# entity writes; loopback in the compose stack.
writer_url = "http://127.0.0.1:8560/"
# The price, in GLM wei per completed request, as a decimal string.
# Published in the LB listing and copied into every agreement record
# at acceptance; changing it here changes new agreements only. Yours to
# set: there is no default, the value below is an example.
wei_per_call = "1000000000000000"
# The address providers' tunnel clients dial, "host:port": this host's
# public address and the tunnel server's port (7000 in the stack).
# Published in the LB listing. Yours to set, like the price.
tunnel_server = "203.0.113.10:7000"
# Agreement slots. At the cap a valid offer waits and expires on its
# own. Below 200: the agreement records are reloaded in one page at
# startup, and the LB refuses to start otherwise.
max_providers = 100
# One loopback port on this host per slot, assigned at acceptance and
# written into the agreement record; the tunnel server binds them. The
# ports run from here up, max_providers of them.
remote_port_start = 20000
# How often the LB looks for new offers, so the longest a freshly
# posted offer waits before it is accepted. Every look is one read at
# the metered reference endpoint, which is what keeps this at minutes.
discovery_interval = "5m"
# An accepted provider's first lifetime: the time it has to connect
# its tunnel before its slot frees up again.
# An even number of seconds: lifetimes are whole blocks of two seconds.
accept_window = "2h"
# How often the listing and every eligible provider's agreement record
# are extended, in one transaction.
refresh_interval = "1h"
# What each refresh extends a record to, from now: a provider stays
# under agreement through an LB outage this long. If a provider
# becomes ineligible, its agreement expires after this time.
# An even number of seconds: lifetimes are whole blocks of two seconds.
agreement_life = "3d"
# Spam protection. Offers expiring further out than this are ignored,
# so nobody can post a page of long-lived offers once and crowd real
# ones out of discovery for good; re-posting costs gas every time.
# An even number of seconds: lifetimes are whole blocks of two seconds.
offer_max_lifetime = "2d"
# An offer whose reported head is further behind the reference than
# this is ignored.
offer_max_lag_blocks = 1000
# The signing key's balance, in GLM, below which every refresh logs a
# warning.
gas_warn_below = "0.02"

# One block per provider. id is the stable handle (lowercase letters,
# digits, '-') used in logs, /nodes and /node/{id}; a tunneled provider
# is just a loopback URL on this host.
#[[providers]]
#id = "node-1"
#url = "http://127.0.0.1:18545"
#[[providers]]
#id = "node-2"
#url = "http://127.0.0.1:18546"
