[package]
name = "lb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytesize = { version = "2.7.0", features = ["serde"] }
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"

[[bin]]
name = "arkiv-lb"
path = "src/main.rs"
