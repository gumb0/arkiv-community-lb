<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/>
    </marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4411a"/>
    </marker>
  </defs>
  <style>
    .v1 { stroke: #9a9a9a; fill: none; stroke-width: 1.6; marker-end: url(#g); }
    .new { stroke: #b4411a; fill: none; stroke-width: 1.8; marker-end: url(#n); }
    .lv1 { fill: #6a6a6a; }
    .lnew { fill: #b4411a; font-weight: 600; }
    .box { fill: #f3f1ec; stroke: #8a8a8a; stroke-width: 1.2; }
    .boxnew { fill: #fbeee6; stroke: #b4411a; stroke-width: 1.2; }
    .lb { fill: none; stroke: #c9c9c9; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .small { font-size: 12.5px; fill: #555; }
    .smallnew { font-size: 12.5px; fill: #b4411a; }
    .t { text-anchor: middle; }
  </style>
  <rect width="980" height="560" fill="#ffffff"/>

  <!-- the LB -->
  <rect x="225" y="30" width="430" height="350" rx="6" class="lb"/>
  <text x="240" y="50" class="small">the LB</text>

  <!-- boxes -->
  <rect x="40" y="60" width="120" height="40" rx="4" class="box"/>
  <text x="100" y="85" class="t">client</text>

  <rect x="250" y="60" width="180" height="40" rx="4" class="box"/>
  <text x="340" y="85" class="t">Proxy</text>

  <rect x="300" y="160" width="180" height="50" rx="4" class="box"/>
  <text x="390" y="180" class="t">provider entry</text>
  <text x="390" y="198" class="t small">health and integrity gates</text>

  <rect x="250" y="290" width="150" height="40" rx="4" class="boxnew"/>
  <text x="325" y="315" class="t lnew">sampled replay</text>

  <rect x="420" y="290" width="130" height="40" rx="4" class="box"/>
  <text x="485" y="315" class="t">integrity round</text>

  <rect x="505" y="160" width="115" height="50" rx="4" class="box"/>
  <text x="562" y="180" class="t">Monitor</text>
  <text x="562" y="198" class="t small">health, every few seconds</text>
  <line x1="620" y1="178" x2="760" y2="92" class="v1"/>
  <text x="672" y="122" class="t lv1">probes</text>
  <line x1="505" y1="185" x2="480" y2="185" class="v1"/>

  <rect x="760" y="60" width="150" height="40" rx="4" class="box"/>
  <text x="835" y="85" class="t">provider</text>

  <rect x="760" y="170" width="150" height="50" rx="4" class="boxnew"/>
  <text x="835" y="190" class="t lnew">benchmark</text>
  <text x="835" y="208" class="t small">a process of its own</text>

  <rect x="760" y="300" width="150" height="40" rx="4" class="boxnew"/>
  <text x="835" y="325" class="t lnew">other providers</text>

  <rect x="280" y="420" width="140" height="40" rx="4" class="box"/>
  <text x="350" y="445" class="t">reference RPC</text>

  <rect x="640" y="420" width="240" height="40" rx="4" class="boxnew"/>
  <text x="760" y="439" class="t lnew">Arkiv records</text>
  <text x="760" y="454" class="t small">verdicts, evidence, benchmark results</text>

  <!-- client path -->
  <line x1="160" y1="80" x2="250" y2="80" class="v1"/>
  <line x1="430" y1="80" x2="760" y2="80" class="v1"/>
  <text x="595" y="72" class="t lv1">client requests; answers back</text>

  <!-- eligibility -->
  <line x1="390" y1="160" x2="390" y2="100" class="v1"/>
  <text x="398" y="135" class="small">in rotation or not</text>

  <!-- sample -->
  <line x1="265" y1="100" x2="265" y2="290" class="new"/>
  <text x="257" y="250" text-anchor="end" class="smallnew">a sample of the requests</text>
  <text x="257" y="266" text-anchor="end" class="smallnew">and their answers</text>

  <!-- verdicts up to the entry -->
  <line x1="340" y1="290" x2="365" y2="210" class="new"/>
  <text x="358" y="258" class="smallnew">verdict</text>
  <line x1="470" y1="290" x2="450" y2="210" class="v1"/>
  <text x="470" y="255" class="small">verdict</text>

  <!-- integrity reads -->
  <line x1="550" y1="295" x2="760" y2="95" class="v1"/>
  <text x="598" y="274" class="lv1">the finalized block, one entity by key</text>
  <line x1="550" y1="315" x2="760" y2="320" class="new"/>
  <text x="660" y="338" class="t smallnew">the same reads, for the quorum</text>

  <!-- to the reference -->
  <line x1="320" y1="330" x2="340" y2="420" class="new"/>
  <text x="195" y="372" class="smallnew">the sampled request,</text>
  <text x="195" y="388" class="smallnew">pinned at its block</text>
  <line x1="460" y1="330" x2="390" y2="420" class="v1"/>
  <text x="425" y="392" class="small">the same two reads</text>

  <!-- durable verdicts -->
  <line x1="470" y1="210" x2="700" y2="420" class="new"/>
  <text x="618" y="352" text-anchor="end" class="smallnew">durable; other LBs read it</text>

  <!-- benchmark -->
  <line x1="835" y1="170" x2="835" y2="100" class="new"/>
  <text x="843" y="140" class="smallnew">a burst</text>
  <polyline points="910,195 935,195 935,440 880,440" class="new"/>
  <text x="942" y="320" class="smallnew">result</text>

  <!-- legend -->
  <line x1="40" y1="525" x2="80" y2="525" class="v1"/>
  <text x="88" y="529" class="small">v1</text>
  <line x1="130" y1="525" x2="170" y2="525" class="new"/>
  <text x="178" y="529" class="small">what this note adds</text>
</svg>
