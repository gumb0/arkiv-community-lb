# frp server (frps) config for the LB host — the tunnel server that NAT'd
# provider nodes connect to. Version pinned project-wide: frp v0.61.1
# (matches the client image in the node distribution).

# Control channel the clients dial. The only port to open in the firewall.
bindPort = 7000

# Forwarded provider ports exist on loopback only: the LB reaches a
# tunneled provider as http://127.0.0.1:<port> on this host, and nothing
# else can reach it.
proxyBindAddr = "127.0.0.1"

# No shared token: the admission hook below is the only gate (see
# docs/TUNNELING.md). A client's token is a signature it alone can make.

# Admission: frps posts every Login and NewProxy to the LB's admin
# listener, with the client's metadata and requested port, and lets the
# client in or turns it away with the reason the node operator reads in
# their own client log. When the LB is down, frps cannot reach the
# route and refuses every client, which is the safe way round.
[[httpPlugins]]
name = "admission"
addr = "127.0.0.1:9545"
path = "/admission"
ops = ["Login", "NewProxy"]
